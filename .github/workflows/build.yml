name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      webview2_version:
        description: 'WebView2 Fixed Version runtime to bundle (blank = latest offered)'
        required: false
        default: ''

# Write access is needed only to attach assets to a release, which happens for tag
# pushes; branch and pull-request runs never publish anything.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VITE_DATA_MODE: native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The catalog is what the official WebView2 download page itself reads. It is
      # undocumented, so a pinned version can be supplied through workflow_dispatch.
      - name: Resolve WebView2 Fixed Version runtime
        id: wv2
        shell: pwsh
        run: |
          $pinned = '${{ inputs.webview2_version }}'
          $catalog = Invoke-RestMethod -Uri 'https://developer.microsoft.com/microsoft-edge/api/webview2'
          if ($pinned) {
            $entry = $catalog | Where-Object { $_.version -eq $pinned } | Select-Object -First 1
            if (-not $entry) { throw "WebView2 fixed version '$pinned' is not offered by the catalog" }
          } else {
            $entry = $catalog | Sort-Object { [version]$_.version } -Descending | Select-Object -First 1
          }
          $build = $entry.builds | Where-Object { $_.architecture -eq 'x64' } | Select-Object -First 1
          if (-not $build) { throw "No x64 build for WebView2 $($entry.version)" }
          "version=$($entry.version)" >> $env:GITHUB_OUTPUT
          "url=$($build.url)" >> $env:GITHUB_OUTPUT
          Write-Host "WebView2 Fixed Version runtime: $($entry.version)"

      # Cache the cab, not the extracted tree: one ~300 MB file beats thousands of
      # entries, and extraction only takes a minute.
      - name: Cache WebView2 installer
        id: wv2cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\wv2.cab
          key: webview2-cab-${{ steps.wv2.outputs.version }}-x64

      - name: Download WebView2 runtime
        if: steps.wv2cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri '${{ steps.wv2.outputs.url }}' -OutFile "$env:RUNNER_TEMP\wv2.cab"
          if (-not (Test-Path "$env:RUNNER_TEMP\wv2.cab")) { throw 'WebView2 cab download produced no file' }

      - name: Extract WebView2 runtime
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\webview2"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          expand.exe "$env:RUNNER_TEMP\wv2.cab" -F:* $dest | Out-Null
          $exe = Get-ChildItem -Path $dest -Filter msedgewebview2.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'WebView2 extraction produced no msedgewebview2.exe' }
          "WEBVIEW2_FIXED_RUNTIME=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Bundled runtime: $($exe.DirectoryName)"

      # beforeBuildCommand in tauri.conf.json already runs build:all, so this
      # produces dist/ and extension/dist/ as well as the release executable.
      - name: Build desktop application
        run: npm run tauri build

      # Report what the host actually links, so a CRT regression shows up in the log
      # instead of only as a packaging failure with no context.
      - name: Report CRT linkage
        shell: pwsh
        run: |
          function Show-Crt($p) {
            if (-not (Test-Path $p)) { Write-Host "CRTSCAN MISSING $p"; return }
            $t = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($p))
            Write-Host ("CRTSCAN {0}: system-ucrt-refs={1}" -f (Split-Path $p -Leaf), $t.Contains('api-ms-win-crt'))
          }
          Show-Crt 'src-tauri\target\release\download-manager.exe'
          $sqlite = Get-ChildItem -Path 'src-tauri\target\release\build' -Recurse -Filter 'sqlite3.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sqlite) { Show-Crt $sqlite.FullName } else { Write-Host 'CRTSCAN sqlite3.lib not found' }

      - name: Package portable release
        # Runners link the system UCRT api-sets instead of a fully static CRT. Those ship
        # with Windows 10 and later and need no redistributable, which is the actual
        # portability requirement; a dependency on vcruntime still fails. Local builds
        # produce a fully static host and pass the stricter check on their own.
        env:
          PORTABLE_ALLOW_SYSTEM_UCRT: '1'
        run: npm run package:portable

      - name: Upload extension
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: extension/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: download-manager-portable
          path: portable/
          if-no-files-found: error
          retention-days: 14

      # tar.exe ships with the runners and handles the ~1 GB tree far faster than
      # Compress-Archive, which is slow with thousands of small WebView2 files.
      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          tar.exe -a -c -f "$env:RUNNER_TEMP\download-manager-$env:GITHUB_REF_NAME-portable-x64.zip" -C portable .
          tar.exe -a -c -f "$env:RUNNER_TEMP\download-manager-extension-$env:GITHUB_REF_NAME.zip" -C extension\dist .

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows desktop download manager: a native Rust transfer engine, a Tauri + React
          manager UI, and a Chromium extension that hands browser downloads to a resident
          native application.

          ### Downloads

          - **portable-x64.zip** - unpack anywhere and run `Download Manager.exe`. Ships the
            browser extension in `extension/` and a colocated WebView2 runtime, so there is
            no installer, no registry entries, and no VC++ redistributable to install.
          - **extension.zip** - the unpacked Chromium extension, if you only need to update
            that. Load it via `chrome://extensions` with developer mode enabled.

          ### Included

          - Browser download interception plus generic media capture, covering progressive
            files and segmented HLS/DASH VOD
          - Three transfer modes chosen automatically from observed source behaviour:
            whole-object multi-connection, ordered-segment multi-connection, and
            single-stream fallback
          - Pause, resume, and restart recovery with preserved partial state
          - Portable layout with all state under `data` beside the executable

          ### Notes

          - Windows 10/11 x64. Chrome is the reference browser; other Chromium browsers
            should work.
          - Early development release. Not production-ready.
          '@
          $notes | Out-File -Encoding utf8 "$env:RUNNER_TEMP\notes.md"
          gh release create "$env:GITHUB_REF_NAME" `
            "$env:RUNNER_TEMP\download-manager-$env:GITHUB_REF_NAME-portable-x64.zip" `
            "$env:RUNNER_TEMP\download-manager-extension-$env:GITHUB_REF_NAME.zip" `
            --title "Download Manager $env:GITHUB_REF_NAME" `
            --notes-file "$env:RUNNER_TEMP\notes.md"
