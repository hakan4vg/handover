<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fa" />
    <title>Download Manager</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div id="root">
      <div class="popup-surface">
        <div class="popup-header">
          <img class="product-logo" src="./icons/icon-32.png" width="18" height="18" alt="" />
          <strong>Download Manager</strong>
          <button class="icon-button" id="open" type="button" title="Open Download Manager" aria-label="Open Download Manager">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 3C3.67 3 3 3.67 3 4.5v7c0 .83.67 1.5 1.5 1.5h7c.83 0 1.5-.67 1.5-1.5V9.27a.5.5 0 0 1 1 0v2.23a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 11.5v-7A2.5 2.5 0 0 1 4.5 2h2.23a.5.5 0 0 1 0 1zm4.27-.5c0-.28.22-.5.5-.5h4.23c.28 0 .5.22.5.5v4.23a.5.5 0 0 1-1 0V3.71L9.62 7.08a.5.5 0 1 1-.7-.7L12.29 3H9.27a.5.5 0 0 1-.5-.5" /></svg>
          </button>
        </div>
        <div id="status" class="form-error popup-error" role="alert" aria-live="assertive" hidden></div>
        <div id="pairing" class="popup-pairing" hidden>
          <span id="pairing-text"></span>
          <button class="button" id="pair" type="button">Pair</button>
        </div>
        <div class="popup-toggles">
          <div class="setting-line">
            <svg class="setting-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M15.5 17a.5.5 0 0 1 .09 1H4.5a.5.5 0 0 1-.09-1H15.5M10 2a.5.5 0 0 1 .5.41V14.3l3.64-3.65a.5.5 0 0 1 .64-.06l.07.06c.17.17.2.44.06.63l-.06.07-4.5 4.5a.5.5 0 0 1-.25.14L10 16a.5.5 0 0 1-.4-.2l-4.46-4.45a.5.5 0 0 1 .64-.76l.07.06 3.65 3.64V2.5c0-.27.22-.5.5-.5" /></svg>
            <strong class="setting-copy">Intercept browser downloads</strong>
            <button class="toggle switch" id="intercept" role="switch" aria-label="Intercept browser downloads" aria-checked="false" type="button"></button>
          </div>
          <div class="setting-line">
            <svg class="setting-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M8.77 7.08A.5.5 0 0 0 8 7.5v5.15a.5.5 0 0 0 .78.42l4-2.65a.5.5 0 0 0-.01-.84zM4.5 3A2.5 2.5 0 0 0 2 5.5v9A2.5 2.5 0 0 0 4.5 17h11a2.5 2.5 0 0 0 2.5-2.5v-9A2.5 2.5 0 0 0 15.5 3zM3 5.5C3 4.67 3.67 4 4.5 4h11c.83 0 1.5.67 1.5 1.5v9c0 .83-.67 1.5-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z" /></svg>
            <strong class="setting-copy">Show media buttons</strong>
            <button class="toggle switch" id="media" role="switch" aria-label="Show media buttons" aria-checked="false" type="button"></button>
          </div>
        </div>
        <div class="popup-card popup-site">
          <div class="site-copy">
            <strong id="site">…</strong>
            <span id="site-state" class="enabled-copy"></span>
          </div>
          <button class="button" id="site-toggle" type="button"></button>
        </div>
        <section class="popup-card popup-filters" aria-labelledby="media-filter-heading">
          <span class="eyebrow" id="media-filter-heading">Media filters</span>
          <div class="filter-row" title="Smaller media gets no button. 0 turns the limit off; streams of unknown size always get one.">
            <label class="filter-label" for="minimum-size">Minimum size</label>
            <div class="filter-input-row">
              <input id="minimum-size" class="filter-input filter-number" type="number" min="0" step="0.1" inputmode="decimal" value="0" />
              <span class="filter-unit" aria-hidden="true">MB</span>
            </div>
          </div>
          <div class="filter-row" title="Comma-separated. GIF matches real GIF responses; animations served as MP4 stay MP4.">
            <label class="filter-label" for="excluded-types">Skip types</label>
            <input id="excluded-types" class="filter-input" type="text" value="gif" placeholder="gif, webp" autocomplete="off" />
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
