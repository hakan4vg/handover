<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f6fa" />
    <title>Download Manager</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div id="root">
      <div class="popup-surface">
        <div class="popup-header">
          <span class="product-logo" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><path d="M12 4v10M8 11l4 4 4-4M5 19h14" /></svg>
          </span>
          <strong>Download Manager</strong>
        </div>
        <div id="status" class="form-error popup-error" role="alert" aria-live="assertive" hidden></div>
        <div class="popup-toggles">
          <div class="setting-line">
            <svg class="setting-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" aria-hidden="true"><path d="M12 4v10M8 11l4 4 4-4M5 19h14" /></svg>
            <div class="setting-copy"><strong>Intercept browser downloads</strong></div>
            <button class="toggle switch" id="intercept" role="switch" aria-label="Intercept browser downloads" aria-checked="false" type="button"></button>
          </div>
          <div class="setting-line">
            <svg class="setting-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="m10 8 6 4-6 4V8Z" /></svg>
            <div class="setting-copy"><strong>Show media buttons</strong></div>
            <button class="toggle switch" id="media" role="switch" aria-label="Show media buttons" aria-checked="false" type="button"></button>
          </div>
        </div>
        <div class="popup-site">
          <span class="eyebrow">Current site</span>
          <strong id="site">…</strong>
          <span id="site-state" class="enabled-copy"></span>
          <button class="button" id="site-toggle" type="button"></button>
        </div>
        <button class="popup-manager-button" id="open" type="button"><span>Open Manager</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" aria-hidden="true"><path d="M7 17.5h10a2 2 0 0 0 2-2V9.8" /><path d="M12 5h7v7M19 5l-8 8" /></svg></button>
      </div>
    </div>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
