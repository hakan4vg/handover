<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 264px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; color: #171a1e; }
      h1 { margin: 0 0 12px; font-size: 14px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid #e2e6eb; }
      .row small { display: block; color: #68717d; font-size: 11px; }
      .site { margin: 10px 0; padding: 10px; border: 1px solid #e2e6eb; border-radius: 7px; background: #f7f9fc; }
      .site strong { display: block; margin-bottom: 4px; }
      .site span { font-size: 11px; color: #68717d; }
      button { cursor: pointer; border: 1px solid #d3d9e1; border-radius: 5px; background: #fff; padding: 6px 10px; font-size: 12px; }
      button:hover { background: #f7f9fc; }
      .switch { position: relative; width: 34px; height: 20px; flex: 0 0 auto; border: 0; border-radius: 999px; background: #aeb7c1; padding: 0; }
      .switch.on { background: #0878ed; }
      .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
      .switch.on::after { left: 17px; }
      #open { width: 100%; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Download Manager</h1>
    <div class="row">
      <div>Intercept browser downloads<small>Take over eligible downloads.</small></div>
      <button class="switch" id="intercept" aria-label="Intercept browser downloads"></button>
    </div>
    <div class="row">
      <div>Show media buttons<small>Download controls on videos.</small></div>
      <button class="switch" id="media" aria-label="Show media buttons"></button>
    </div>
    <div class="site">
      <strong id="site">…</strong>
      <span id="site-state"></span>
      <div style="margin-top: 8px"><button id="site-toggle"></button></div>
    </div>
    <button id="open">Open Manager</button>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
